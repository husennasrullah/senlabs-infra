server {
    listen 80;
    server_name jobs.senlabs.web.id;
    return 301 https://jobs.senlabs.web.id$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name jobs.senlabs.web.id;

    ssl_certificate     /etc/letsencrypt/live/jobs.senlabs.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobs.senlabs.web.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Frontend Vite
    location / {
        proxy_pass         http://host-gateway:3006;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend Go API
    location /api/ {
        proxy_pass         http://host-gateway:8086;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
