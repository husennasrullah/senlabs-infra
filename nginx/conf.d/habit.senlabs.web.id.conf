server {
    listen 80;
    server_name habit.senlabs.web.id;
    return 301 https://habit.senlabs.web.id$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name habit.senlabs.web.id;

    ssl_certificate     /etc/letsencrypt/live/habit.senlabs.web.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/habit.senlabs.web.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    client_max_body_size 50M; 

    location / {
        proxy_pass         http://host-gateway:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Khusus serve foto — disable gzip & buffering untuk binary stream
    location ~* /api/v1/memories/.+/photos/.+/serve {
        proxy_pass         http://host-gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        gzip               off;
    }

    location /api/ {
        proxy_pass         http://host-gateway:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
